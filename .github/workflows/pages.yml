# Publishes the Speaker Stand Bench simulator to GitHub Pages:
#   https://ayenn1214.github.io/orpheus/
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Pages demo

on:
  push:
    branches: [main]
    paths: [sim/**, docs/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build site
        run: |
          mkdir -p _site/docs
          cp docs/*.png docs/*.svg _site/docs/
          sed 's#href="\.\./docs/#href="docs/#' sim/stand_bench.html > _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
